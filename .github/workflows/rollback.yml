name: Rollback - Revert to Last Stable

on:
  workflow_run:
    workflows: ["CD - Deploy Render"]
    types: [completed]

jobs:
  rollback:
    # Se activa si el CD falla (Punto c)
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Rollback
        run: |
          # 1. Buscar último commit exitoso (Punto b)
          LAST_STABLE=$(curl -s -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys \
            | jq -r '.[] | select(.status=="live" or .deploy.status=="live") | .commit.id // .deploy.commitId' | head -n 1)

          # 2. Revertir (Punto a)
          curl -s -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" -H "Content-Type: application/json" \
            -X POST -d "{\"commitId\": \"$LAST_STABLE\"}" \
            https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys
