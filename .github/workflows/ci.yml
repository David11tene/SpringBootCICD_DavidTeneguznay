# Nombre del flujo: Se encarga de validar el código
name: CI - Build and Test

# Disparadores: Cuándo debe correr este proceso
on:
  push:
    branches:
      - main # Se activa al subir cambios directamente a la rama principal
  pull_request:
    branches:
      - main # Se activa cuando alguien propone cambios mediante un PR

jobs:
  build:
    runs-on: ubuntu-latest # Usa una máquina virtual con Linux (Ubuntu)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # Paso 1: Descarga el código del repositorio en la máquina virtual

      - name: Set up JDK 21
        uses: actions/setup-java@v4 # Paso 2: Configura el entorno de Java versión 21
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew # Paso 3: Otorga permisos de ejecución al script de Gradle

      - name: Build with Gradle
        run: ./gradlew clean build # Paso 4: Compila el proyecto y genera el artefacto (jar)

      - name: Run Tests
        run: ./gradlew test # Paso 5: Ejecuta todas las pruebas unitarias y de integración
