name: CD - Deploy Render

on:
  workflow_run:
    workflows: ["CI - Build and Test"]
    types: [completed]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Render
        run: |
          # 1. Actualizar versión en Render (Punto d)
          curl -s -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" -H "Content-Type: application/json" \
            -X PATCH -d "{\"envVars\": [{\"key\": \"APP_VERSION\", \"value\": \"${{ github.run_number }}\"}]}" \
            https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}

          # 2. Iniciar deploy y capturar ID
          ID=$(curl -s -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" -X POST \
            https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys | jq -r .id)

          # 3. Esperar éxito o fallo (Punto c)
          until [ "$ST" == "live" ]; do
            ST=$(curl -s -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
              https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys/$ID | jq -r .status)
            echo "Estado: $ST"
            if [ "$ST" == "build_failed" ] || [ "$ST" == "update_failed" ]; then exit 1; fi
            sleep 30
          # 4. Simular fallo para activar rollback
          exit 1
          done
